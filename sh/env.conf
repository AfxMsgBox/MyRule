# MyProxy 全局配置；变量含义与 README 的 env.local.conf 一节一致。
#
# 可配置变量（本机值写入 $MP_INST_DIR/sh/env.local.conf，不要在本文件填写凭据）：
#   MP_REPO_BRANCH   仓库分支名，默认/空值为 main；仓库固定为 AfxMsgBox/MyRule。
#                    本地安装也保存此项，供之后从 GitHub 更新使用。
#   MP_PROXY         外部后备代理 URL，默认空；支持 http/https/socks5/socks5h。
#                    下载顺序为当前 Core 代理 → 此代理 → 直连；空值仅跳过外部代理。
#   MP_SUBSCRIBE_URL 节点订阅 URL，安装必填；用于渲染 Core 的 proxy-providers。
#   MP_AGH_USER_NAME AGH Web UI 管理员用户名，安装必填。
#   MP_AGH_PASSWORD  AGH 管理员密码的 bcrypt 哈希，安装必填，不是明文密码；
#                    支持 $2a$ / $2b$ / $2y$ 前缀，配置中用单引号包裹。
#   MP_LOCAL_DNS     AGH 默认上游 DNS，多个地址用空格分隔；
#                    未设置时为 223.5.5.5 119.29.29.29，显式空值读取 /etc/resolv.conf。
#   MP_INST_DIR      安装根目录，默认 /etc/proxy；用于定位本机配置及 sh/core/agh。
#
# 内部派生变量（自动生成，不接受独立配置）：
#   MP_REPO_BRANCH_PATH 分支名按路径段进行 URL 编码后的值。
#   MP_REPO_RAW_URL     由固定仓库与分支生成的 Raw 地址，旧配置值不再生效。
#   MP_CORE_DIR         $MP_INST_DIR/core，Mihomo 工作目录。
#   MP_AGH_DIR          $MP_INST_DIR/agh，AdGuardHome 工作目录。
#
# 脚本加载本文件后获得合并后的配置；变量自动 export，供子进程读取。
#
# 命名约定：MP_* 全大写 = 全局；小写 = 本脚本/共享内部
#
# 日常脚本的可配置变量优先级（高 → 低）：
#   1) 调用方环境变量（MP_INST_DIR=xxx sh script.sh）
#   2) env.local.conf（敏感参数 / 本机定制）
#   3) 本文件默认值（MP_LOCAL_DNS 保留显式空值）
# 静默安装另按命令行参数及默认值决定，不从环境变量或旧配置补齐。
#
# 加载顺序：
#   1) 快照调用方在系统环境里预设的 MP_* 变量
#   2) 设置各项默认值
#   3) source env.local.conf（本机定制，直接赋值会盖掉默认值）
#   4) 重新应用第 1 步快照，使系统环境变量优先级高于 env.local.conf
#   5) 根据最终分支及 MP_INST_DIR 生成仓库地址和 core/agh 路径

set -a

# 快照：调用方在系统环境里预设的 MP_* 变量（优先级最高）。
# env.local.conf 用直接赋值会盖掉它们，故在其后重新 eval 应用一次。
_mp_env_override=$(export -p 2>/dev/null | grep -E ' MP_[A-Za-z0-9_]+=' || true)

# 仓库固定为 AfxMsgBox/MyRule；仅分支可配置，旧 Raw URL 不再作为输入。
MP_REPO_BRANCH="${MP_REPO_BRANCH:-main}"

# 用户提供的外部代理；支持 http/https/socks5/socks5h。
# 安装自举及日常更新都在 Core 本机代理之后作为后备。
MP_PROXY="${MP_PROXY:-}"

# 安装根目录（sh/ core/ agh/ 都是其子目录；init.d / hotplug / systemd 里 $0
# 不可靠，靠此变量定位 env.local.conf 与各子目录）
MP_INST_DIR="${MP_INST_DIR:-/etc/proxy}"

# AGH 默认上游 DNS（空格分隔多个）；置空则从 /etc/resolv.conf 取 nameserver
MP_LOCAL_DNS="${MP_LOCAL_DNS-223.5.5.5 119.29.29.29}"

# 敏感参数（默认空，由 env.local.conf 填写）
MP_SUBSCRIBE_URL="${MP_SUBSCRIBE_URL:-}"
# AGH Web UI 管理员账号；密码字段是 bcrypt 哈希（$2a$ / $2b$ / $2y$ 开头）
MP_AGH_USER_NAME="${MP_AGH_USER_NAME:-}"
MP_AGH_PASSWORD="${MP_AGH_PASSWORD:-}"

# 加载本地覆盖
[ -f "$MP_INST_DIR/sh/env.local.conf" ] && . "$MP_INST_DIR/sh/env.local.conf"

# 重新应用系统环境变量，使其优先级高于 env.local.conf
[ -n "$_mp_env_override" ] && eval "$_mp_env_override"
unset _mp_env_override

MP_REPO_BRANCH="${MP_REPO_BRANCH:-main}"
command -v jq >/dev/null 2>&1 \
    || { echo '缺少 jq；请先安装 jq（Debian/Ubuntu: apt install jq；OpenWrt: opkg install jq 或 apk add jq）' >&2; return 1; }
# 保留分支中的 /，对其余 URL 特殊字符编码。派生项不可由旧环境变量覆盖。
MP_REPO_BRANCH_PATH=$(printf '%s' "$MP_REPO_BRANCH" | jq -sRr 'split("/") | map(@uri) | join("/")') || return 1
MP_REPO_RAW_URL="https://raw.githubusercontent.com/AfxMsgBox/MyRule/refs/heads/$MP_REPO_BRANCH_PATH"

# 路径结构是项目约定，不提供互相独立、容易与服务文件失配的覆盖项。
MP_CORE_DIR="$MP_INST_DIR/core"
MP_AGH_DIR="$MP_INST_DIR/agh"

set +a
