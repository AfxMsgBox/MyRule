mixed-port: 7890
#redir-port: 7892
tproxy-port: 7893
allow-lan: true
mode: rule
log-level: warning
ipv6: false
external-controller:  :3721
external-ui: ui
#secret:
tcp-concurrent: true
geo-auto-update: false
# 不启用 unified-delay：官方文档称其用于"消除连接握手等带来的不同类型节点的延迟差异"，
# 而本机场节点全部是同协议、tls:false、同域名，没有类型差异可消除；握手时间本就是
# 真实体验的一部分，应当计入测速。
# 若将来接入 Trojan / Reality 等带 TLS 握手的节点，与现有节点混在同一 url-test 组里
# 选路，再重新评估。
#
# 网关转发的流量没有本地进程可查，规则里也没有 PROCESS-NAME。
# 默认值 strict 的含义是"由内核自行判断是否开启"，在无 PROCESS 规则时大概率本就不查，
# 所以这里显式写 off 主要是把行为固定下来、不依赖该判断逻辑，性能收益预期接近于零。
# 必须加引号：YAML 会把裸写的 off 解析成布尔 false，而这里要的是字符串枚举。
find-process-mode: "off"

#长连接alive问题：https://github.com/vernesong/OpenClash/issues/2614
#keep-alive-idle 没有数据活动，它会发起一个 keep alive 包给客户端
#如果客户端没有回应,内核会每间隔 keep-alive-interval秒 发送一次探测包
#持续发送 KEEP_COUNT (默认值为 9) 次后，如果一直没有收到回应，则认为连接无效，会从内存中清除相关的连接信息
keep-alive-idle: 60
keep-alive-interval: 30
disable-keep-alive: false

#
profile:
  store-selected: true
  store-fake-ip: true
#

#tunnels:
#- network: [tcp, udp]
#  address: 0.0.0.0:853
#  target: 8.8.8.8:53
#  proxy: defaultProxy

tun:
  enable: true
  device: utun
  stack: mixed
  # TUN 是内核与 mihomo 之间的本地通道，MTU 与真实链路解耦（mihomo 在此终结 TCP
  # 再对外重新建连）。9000 是 mihomo 默认值，包数少、syscall 少，大文件吞吐更好。
  # 原值 1400 会把数据切碎。若某台设备出现丢包/卡顿，回退到 1400。
  mtu: 9000
  # 通用分段卸载，仅支持 Linux。让内核把多个包合并成大段一次交给 mihomo，
  # 显著减少 syscall 次数。与上面的 mtu: 9000 是同方向、互相放大的两个杠杆，
  # 官方示例里也是配套出现的。
  # gso-max-size 取官方示例值 65536（应与默认值相同，显式写出便于日后调整）。
  gso: true
  gso-max-size: 65536
  auto-route: false
  auto-redir: false
  auto-detect-interface: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: :253
  use-hosts: false
  fake-ip-range: 198.18.0.1/16
  # AGH 在前面完成域名分流，转发到这里的域名一律返回 fake-ip（本地分配，不查上游）。
  # 所以下面的上游只服务两类查询：节点服务器域名，以及 mihomo 自身直连时的解析
  # （目前仅 proxy-providers 的订阅刷新）。
  #
  # 不写 nameserver 会退回到版本相关的内置默认或系统解析器，各设备行为不一致，故写死。
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 机场节点全部在 paeadiy.com 下，该域名会被运营商污染，必须走机场自己的 DNS。
  # 这台 DNS 只解析 paeadiy.com，因此用按域名匹配的 policy，不能用 proxy-server-nameserver
  # ——后者按"所有节点域名"一刀切，机场若在别的域名下加节点，查询会被送去一台
  # 拒绝解析它们的服务器。通配符覆盖将来可能出现的 cp2/cp3 等主机名。
  nameserver-policy:
    '+.paeadiy.com': '47.116.209.9:39053'

proxy-providers:
  HongKong:
    type: http
    path: ./proxy/HongKong.yaml
    interval: 86400
    url: {MP_SUBSCRIBE_URL}&insert=false&exclude=%E8%AF%95%E7%94%A8&include=%E9%A6%99%E6%B8%AF&append_type=true&emoji=true&list=true&tfo=false&scv=true&fdn=true&sort=true&new_name=true
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      expected-status: 204
      interval: 1800
#-------------------------
  Japan:
    type: http
    path: ./proxy/Japan.yaml
    interval: 86400
    url: {MP_SUBSCRIBE_URL}&insert=false&exclude=%E8%AF%95%E7%94%A8&include=%E6%97%A5%E6%9C%AC&append_type=true&emoji=true&list=true&tfo=false&scv=true&fdn=true&sort=true&new_name=true
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      expected-status: 204
      interval: 1800
#-------------------------
  Singapore:
    type: http
    path: ./proxy/Singapore.yaml
    interval: 86400
    url: {MP_SUBSCRIBE_URL}&insert=false&exclude=%E8%AF%95%E7%94%A8&include=%E6%96%B0%E5%8A%A0%E5%9D%A1&append_type=true&emoji=true&list=true&tfo=false&scv=true&fdn=true&sort=true&new_name=true
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      expected-status: 204
      interval: 1800
#-------------------------
  TaiWan:
    type: http
    path: ./proxy/TaiWan.yaml
    interval: 86400
    url: {MP_SUBSCRIBE_URL}&insert=false&exclude=%E8%AF%95%E7%94%A8&include=%E5%8F%B0%E6%B9%BE&append_type=true&emoji=true&list=true&tfo=false&scv=true&fdn=true&sort=true&new_name=true
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      expected-status: 204
      interval: 1800
#-------------------------
  USA:
    type: http
    path: ./proxy/USA.yaml
    interval: 86400
    url: {MP_SUBSCRIBE_URL}&insert=false&exclude=%E8%AF%95%E7%94%A8&include=%E7%BE%8E%E5%9B%BD&append_type=true&emoji=true&list=true&tfo=false&scv=true&fdn=true&sort=true&new_name=true
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      expected-status: 204
      interval: 1800

proxy-groups:
  - name: fastHongKong
    type: url-test
    interval: 600
    tolerance: 30
    lazy: true
    url: 'http://www.gstatic.com/generate_204'
    use:
      - HongKong
#-------------------------
  - name: fastJapan
    type: url-test
    interval: 600
    tolerance: 50
    lazy: true
    url: 'http://www.gstatic.com/generate_204'
    use:
      - Japan
#-------------------------
  - name: fastSingapore
    type: url-test
    interval: 600
    tolerance: 50
    lazy: true
    url: 'http://www.gstatic.com/generate_204'
    use:
      - Singapore
#-------------------------
  - name: fastTaiWan
    type: url-test
    interval: 600
    tolerance: 30
    lazy: true
    url: 'http://www.gstatic.com/generate_204'
    use:
      - TaiWan
#-------------------------
  - name: fastUSA
    type: url-test
    interval: 600
    tolerance: 50
    lazy: true
    url: 'http://www.gstatic.com/generate_204'
    use:
      - USA
#-------------------------
  - name: defaultProxy
    type: select
    proxies:
      - fastHongKong
      - fastJapan
      - fastSingapore
      - fastTaiWan
      - fastUSA
      - selectProxy
#-------------------------
  - name: gptProxy
    type: select
    proxies:
      - fastJapan
      - fastSingapore
      - fastTaiWan
      - fastUSA
      - selectProxy
#-------------------------
  - name: selectProxy
    type: select
    use:
      - USA
      - HongKong
      - TaiWan
      - Japan
      - Singapore
  
rule-providers:
  rule_gpt:
    behavior: domain
    interval: 86400
    path: ./ruleset/gpt.yaml
    type: http
    proxy: fastHongKong
    url: "https://raw.githubusercontent.com/AfxMsgBox/MyRule/main/domain/gpt.txt"

rules:
 - RULE-SET,rule_gpt,gptProxy
 - MATCH, defaultProxy
